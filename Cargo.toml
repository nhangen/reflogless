[package]
name = "reflogless"
version = "1.1.0"
edition = "2021"
description = "Local untracked-file safety net for git"
license = "MIT"
repository = "https://github.com/nhangen/reflogless"
homepage = "https://github.com/nhangen/reflogless"

[[bin]]
name = "reflogless"
path = "src/main.rs"

[lib]
name = "reflogless"
path = "src/lib.rs"

[dependencies]
age = { version = "0.11", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
fs4 = { version = "0.13", default-features = false, features = ["sync"] }
ignore = "0.4"
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
signal-hook = { version = "0.3", default-features = false }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
rust-s3 = { version = "0.37", default-features = false, features = ["sync-native-tls"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "2.5"
thiserror = "1.0"
toml = "0.8"

[features]
default = []
remote = ["dep:rust-s3"]

[dev-dependencies]
tempfile = "3.10"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
